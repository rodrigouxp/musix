[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "musix"
description = "MUSIX"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

dependencies = [
    "pillow>=11.1.0",
    "Flask>=3.1.0",
    "Flask-Cors>=3.0.10",
    "requests>=2.27.1",
    "colorgram.py>=1.2.0",
    "tqdm>=4.65.0",
    "Unidecode>=1.3.6",
    "psutil>=5.9.4",
    "show-in-file-manager>=1.1.4",
    "flask-compress>=1.13",
    "tabulate>=0.9.0",
    "setproctitle>=1.3.2",
    "locust>=2.20.1",
    "watchdog>=4.0.0",
    "flask-jwt-extended>=4.6.0",
    "sqlalchemy>=2.0.31",
    "memory-profiler>=0.61.0",
    "sortedcontainers>=2.4.0",
    "xxhash>=3.4.1",
    "ffmpeg-python>=0.2.0",
    "schedule>=1.2.2",
    "pillow>=11.1.0",
    "flask-openapi3==3.0.2",
    "rapidfuzz==3.14.5",
    "pendulum>=3.0.0",
    "pystray>=0.19.5",
    "cryptography>=46.0.1",
    "waitress>=3.0.2; sys_platform == 'win32'",
    "waitress>=3.0.2",
    "granian>=2.5.5",
    "asgiref>=3.10.0",
    "natsort>=8.4.0",
    "blurhash-python>=1.2.2",
    "nuitka>=4.0.8",
    "tinytag>=2.2.1",
    "mutagen>=1.48.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller",
    "nuitka>=4.0.8",
]

[tool.uv]
dependency-metadata = [
    { name = "waitress", version = "3.0.2", requires-dist = [], requires-python = ">=3.11" },
    { name = "bjoern", version="3.2.2", requires-dist = [], requires-python = ">=3.11"}
]

[project.scripts]
musix = "musix.__main__:run"


[project.urls]
Homepage = "https://github.com/rodrigouxp/musix"
Repository = "https://github.com/rodrigouxp/musix"
Documentation = "https://github.com/rodrigouxp/musix#readme"
Issues = "https://github.com/rodrigouxp/musix/issues"


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
exclude = ["*.tests", "*.tests.*"]

# setuptools-scm's file finder still tracks files under excluded packages;
# keep test trees out of wheels/sdists explicitly.
[tool.setuptools.exclude-package-data]
"*" = ["*/tests/*", "tests/*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "v0.0.0"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
