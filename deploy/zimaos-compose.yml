# Cole em ZimaOS > Install Custom App > YAML (ou Import).
# Roda em paralelo ao Swing da App Store (porta 1970, /config proprio).
services:
  musix:
    container_name: musix
    image: ghcr.io/rodrigouxp/musix:dev
    pull_policy: always
    restart: unless-stopped
    cpu_shares: 90
    ports:
      - mode: ingress
        target: 1970
        published: "1971"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/musix/config
        target: /config
      - type: bind
        source: "/media/HD_1_TB/Músicas"
        target: /music
    deploy:
      resources:
        limits:
          memory: 5.71GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
x-casaos:
  architectures:
    - amd64
  category: Media
  main: musix
  port_map: "1971"
  scheme: http
  index: /
  title:
    custom: MUSIX
  tagline:
    custom: Player de música local
  icon: https://cdn.jsdelivr.net/gh/rodrigouxp/musix@master/deploy/icon.png
