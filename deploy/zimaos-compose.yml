# Cole em ZimaOS > Install Custom App > YAML (ou Import).
# Roda em paralelo ao Swing da App Store (porta 1970, /config proprio).
services:
  musix:
    container_name: musix
    image: ghcr.io/rodrigouxp/musix:dev
    pull_policy: always
    restart: unless-stopped
    cpu_shares: 90
    environment:
      # "Open in files": abre a pasta da musica no app Files do ZimaOS (em uma aba nova).
      # MUSIX_HOST_PATHS troca o caminho do container pelo que o Files mostra (o mesmo da
      # pasta de musica montada em /music, sem o /media do inicio); varios pares separados por ;
      # MUSIX_FILES_URL e o endereco do Files: {origin} vira o endereco por onde voce abriu o MUSIX
      # (IP de casa, da VPN ou dominio, sem a porta) e {path} a pasta.
      MUSIX_HOST_PATHS: "/music=/HD_1_TB/Músicas"
      MUSIX_FILES_URL: "{origin}/modules/icewhale_files/index.html#/files/{path}"
    ports:
      - mode: ingress
        target: 1970
        published: "1972"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/musix/config
        target: /config
      - type: bind
        source: "/media/HD_1_TB/Músicas"
        target: /music
    deploy:
      resources:
        limits:
          memory: 5.71GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
x-casaos:
  architectures:
    - amd64
  category: Media
  main: musix
  port_map: "1972"
  scheme: http
  index: /
  title:
    custom: MUSIX
  tagline:
    custom: Player de música local
  icon: https://cdn.jsdelivr.net/gh/rodrigouxp/musix@master/deploy/icon.png
